<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#60a5fa">
  <title>Closet App</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <header>
    <div class="logo">👕 Closet</div>
    <nav>
      <button class="tab active" data-view="closet">My Closet</button>
      <button class="tab" data-view="outfits">Outfits</button>
      <button class="tab" data-view="stats">Stats</button>
      <button class="tab" data-view="add">+ Add Item</button>
    </nav>
  </header>

  <main>

    <!-- ── Closet View ── -->
    <section id="view-closet" class="view active">
      <div class="closet-toolbar">
        <div class="search-box">
          <span class="search-icon">⌕</span>
          <input type="text" id="closet-search" placeholder="Search items…" class="closet-search-input">
        </div>
        <select id="closet-sort" class="sort-select">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="name">Name A–Z</option>
          <option value="worn">Most Worn</option>
          <option value="never">Never Worn</option>
        </select>
      </div>
      <div class="filter-bar">
        <button class="filter active" data-cat="">All</button>
        <button class="filter" data-cat="tops">Tops</button>
        <button class="filter" data-cat="bottoms">Bottoms</button>
        <button class="filter" data-cat="shoes">Shoes</button>
        <button class="filter" data-cat="outerwear">Outerwear</button>
        <button class="filter" data-cat="accessories">Accessories</button>
      </div>
      <div class="filter-bar tag-filter-bar">
        <button class="filter active" data-tag="">All Tags</button>
        <button class="filter" data-tag="casual">Casual</button>
        <button class="filter" data-tag="work">Work</button>
        <button class="filter" data-tag="formal">Formal</button>
        <button class="filter" data-tag="gym">Gym</button>
        <button class="filter" data-tag="outdoor">Outdoor</button>
      </div>
      <div id="items-grid" class="items-grid"></div>
    </section>

    <!-- ── Outfits View ── -->
    <section id="view-outfits" class="view">
      <div class="section-header">
        <h2>Saved Outfits</h2>
        <div style="display:flex;gap:8px">
          <button id="btn-new-suggest" class="btn-secondary">✨ Suggest</button>
          <button id="btn-new-outfit" class="btn-primary">+ New Outfit</button>
        </div>
      </div>
      <div id="outfits-list" class="outfits-list"></div>
    </section>

    <!-- ── Stats View ── -->
    <section id="view-stats" class="view">
      <div id="stats-content"></div>
    </section>

    <!-- ── Add Item View ── -->
    <section id="view-add" class="view">
      <div class="add-options">
        <button class="add-option-btn" id="btn-show-camera">
          <span class="option-icon">📷</span>
          <span class="option-label">Camera / Upload</span>
          <span class="option-sub">Take a photo or upload from your device</span>
        </button>
        <button class="add-option-btn" id="btn-show-search">
          <span class="option-icon">🔍</span>
          <span class="option-label">Search</span>
          <span class="option-sub">Describe an item and AI fills in the details</span>
        </button>
      </div>

      <!-- Camera panel -->
      <div id="panel-camera" class="input-panel hidden">
        <input type="file" id="camera-input" accept="image/*" class="hidden">
        <div id="image-preview-wrap" class="image-preview-wrap hidden">
          <img id="preview-img" src="" alt="Preview">
        </div>
        <button id="btn-choose-photo" class="btn-secondary">Choose Photo</button>
        <button id="btn-analyze" class="btn-primary hidden">Analyze with AI</button>
        <div id="camera-loading" class="loading hidden">Analyzing photo…</div>
        <div id="camera-error" class="error-msg hidden"></div>
      </div>

      <!-- Search panel -->
      <div id="panel-search" class="input-panel hidden">
        <div class="search-row">
          <input type="text" id="search-input" placeholder="e.g. black leather jacket, white Nike sneakers…" class="text-field">
          <button id="btn-do-search" class="btn-primary">Look Up</button>
        </div>
        <div id="search-loading" class="loading hidden">Looking up item…</div>
        <div id="search-error" class="error-msg hidden"></div>
      </div>

      <!-- Identified item form (shared by camera + search) -->
      <div id="identified-form" class="identified-form hidden">
        <h3>Identified Item <span class="form-hint">Edit any details before saving</span></h3>
        <div class="form-grid">
          <label>Name<input type="text" id="f-name"></label>
          <label>Category
            <select id="f-category">
              <option value="tops">Tops</option>
              <option value="bottoms">Bottoms</option>
              <option value="shoes">Shoes</option>
              <option value="outerwear">Outerwear</option>
              <option value="accessories">Accessories</option>
            </select>
          </label>
          <label>Color<input type="text" id="f-color"></label>
          <label>Size<input type="text" id="f-size" placeholder="optional"></label>
          <label>Brand<input type="text" id="f-brand" placeholder="optional"></label>
        </div>
        <div class="tags-field">
          <label>Tags</label>
          <div class="tag-checks">
            <label class="tag-check-label"><input type="checkbox" class="tag-check" value="casual"> Casual</label>
            <label class="tag-check-label"><input type="checkbox" class="tag-check" value="work"> Work</label>
            <label class="tag-check-label"><input type="checkbox" class="tag-check" value="formal"> Formal</label>
            <label class="tag-check-label"><input type="checkbox" class="tag-check" value="gym"> Gym</label>
            <label class="tag-check-label"><input type="checkbox" class="tag-check" value="outdoor"> Outdoor</label>
          </div>
        </div>
        <div class="form-actions">
          <button id="btn-save-item" class="btn-primary">Add to Closet</button>
          <button id="btn-discard" class="btn-secondary">Discard</button>
        </div>
        <div id="save-error" class="error-msg hidden"></div>
      </div>
    </section>

  </main>

  <!-- ── Suggest Outfit Modal ── -->
  <div id="suggest-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>✨ Suggest an Outfit</h2>
      <div id="suggest-occasions">
        <p class="modal-sub">What's the occasion?</p>
        <div class="occasion-grid">
          <button class="occasion-btn" data-occasion="casual day">👕<br>Casual</button>
          <button class="occasion-btn" data-occasion="work or office">💼<br>Work</button>
          <button class="occasion-btn" data-occasion="formal event">🎩<br>Formal</button>
          <button class="occasion-btn" data-occasion="date night">🌙<br>Date Night</button>
          <button class="occasion-btn" data-occasion="gym workout">🏋️<br>Gym</button>
          <button class="occasion-btn" data-occasion="outdoor activity">🌲<br>Outdoor</button>
        </div>
        <div class="modal-actions">
          <button id="btn-cancel-suggest" class="btn-secondary">Cancel</button>
        </div>
      </div>
      <div id="suggest-loading" class="loading hidden">Picking the perfect outfit…</div>
      <div id="suggest-result" class="hidden">
        <p class="suggest-name" id="suggest-outfit-name"></p>
        <p class="suggest-reason" id="suggest-reasoning"></p>
        <div id="suggest-items-list" class="suggest-items-list"></div>
        <div id="suggest-save-error" class="error-msg hidden"></div>
        <div class="modal-actions">
          <button id="btn-save-suggestion" class="btn-primary">Save Outfit</button>
          <button id="btn-try-again" class="btn-secondary">Try Again</button>
          <button id="btn-cancel-suggest2" class="btn-secondary">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── New Outfit Modal ── -->
  <div id="outfit-modal" class="modal-overlay hidden">
    <div class="modal">
      <h2>Build an Outfit</h2>
      <input type="text" id="outfit-name-input" placeholder="Outfit name…" class="text-field">
      <p class="modal-sub">Tap items to include them in this outfit:</p>
      <div id="modal-items-grid" class="items-grid selectable"></div>
      <div id="outfit-error" class="error-msg hidden"></div>
      <div class="modal-actions">
        <button id="btn-save-outfit" class="btn-primary">Save Outfit</button>
        <button id="btn-cancel-outfit" class="btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ── Outfit Detail Modal ── -->
  <div id="outfit-detail-modal" class="modal-overlay hidden">
    <div class="modal outfit-detail-modal">
      <button class="btn-close-modal" id="btn-close-outfit-detail">×</button>
      <h2 id="outfit-detail-name"></h2>
      <div id="outfit-detail-grid" class="outfit-detail-grid"></div>
      <div id="outfit-detail-chips" class="outfit-detail-chips"></div>
      <div class="modal-actions">
        <button id="btn-outfit-detail-delete" class="btn-secondary btn-danger">Delete Outfit</button>
        <button id="btn-close-outfit-detail2" class="btn-secondary">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Item Detail Modal ── -->
  <div id="item-detail-modal" class="modal-overlay hidden">
    <div class="modal item-detail-modal">
      <button id="btn-close-detail" class="btn-close-detail">×</button>
      <div class="detail-image-wrap" id="detail-image-wrap">
        <img id="detail-img" src="" alt="" class="detail-img hidden">
        <div id="detail-icon" class="detail-icon hidden"></div>
      </div>
      <div class="detail-body">
        <div>
          <h2 id="detail-name"></h2>
          <span id="detail-cat-badge" class="item-cat-badge"></span>
        </div>
        <div class="detail-meta-grid">
          <div class="detail-meta-item"><span class="detail-meta-label">Color</span><span id="detail-color"></span></div>
          <div class="detail-meta-item"><span class="detail-meta-label">Size</span><span id="detail-size"></span></div>
          <div class="detail-meta-item"><span class="detail-meta-label">Brand</span><span id="detail-brand"></span></div>
          <div class="detail-meta-item"><span class="detail-meta-label">Worn</span><span id="detail-wear"></span></div>
        </div>
        <div id="detail-tags" class="item-tags"></div>
        <div class="detail-actions">
          <button id="btn-detail-wear" class="btn-primary">✓ Log Wear</button>
          <button id="btn-detail-find-img" class="btn-secondary hidden">🔍 Find Image</button>
          <button id="btn-detail-delete" class="btn-secondary btn-danger">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
